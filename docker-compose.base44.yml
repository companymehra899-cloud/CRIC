services:
  backend:
    image: node:22-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      - PORT=3001
    env_file:
      - /run/base44/app.env
    expose:
      - "3001"
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
